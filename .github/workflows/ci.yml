name: CI

on:
  pull_request:
  push:
    branches: [main]
  # the release workflow calls this whole suite on the tagged commit and
  # publishes only when every job passed
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the advertised engines floor (>=20; Node 20 is past end of life but
        # still supported here), the previous LTS and the current LTS (24), so
        # an API missing on any of them can't slip in
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # the package's distribution shape is part of the contract: tsc must
      # actually EMIT, the bin entry must exist and resolve, and the tarball
      # must stay lean (assets are allowlisted in package.json "files")
      - run: npm run build
      - name: verify bin entry resolves
        run: |
          test -f dist/cli/index.js
          node dist/cli/index.js --help > /dev/null
      # asserts the tarball contents (entry present; no src/, test/,
      # spikes/, env files or backups) and a size ceiling
      - run: npm run check:pack
      # whole unit suite (no explicit file list, so new test files aren't
      # silently skipped); the e2e files run in the browser-e2e job below,
      # which has chromium + ffmpeg installed.
      - run: npx vitest run --exclude '**/*.e2e.test.ts'
      # deliberately STRICT (no --omit=dev): dev-tree advisories must stay
      # visible. This is green because the lockfile is clean, not because the
      # check was weakened, keep it that way.
      - run: npm audit --audit-level=moderate

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # filter by the *.e2e.test.ts naming convention (not an explicit file
      # list) so a new e2e file cannot be silently skipped here, the same
      # rule the unit job above already follows in the other direction
      - run: npm test -- --run e2e.test

  # what users actually get: pack the tarball, install it into an empty
  # project, and run it. Catches a missing bin, a missing dependency, or
  # bundled assets that do not resolve from an installed copy.
  packed-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: pack and install into a temp project
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent | tail -n 1)"
          SMOKE="$(mktemp -d)"
          cp "$TARBALL" "$SMOKE/"
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "./$TARBALL"
          npx supercut --help
          node --input-type=module -e '
            import { resolveBackgroundSpec, resolveMusicTrack } from "@co-messi/supercut";
            const bg = resolveBackgroundSpec("cobalt");
            if (!bg.isImage) throw new Error("bundled background cobalt did not resolve: " + JSON.stringify(bg));
            const track = resolveMusicTrack("pulse");
            if (!track) throw new Error("bundled music track pulse did not resolve");
            console.log("assets ok:", bg.spec, track);
          '
      # npm 11 rewrites or drops package.json fields it considers invalid at
      # publish time (a ./ prefixed bin is removed), and npm 10 on this runner
      # does not. `npm pkg fix` applies the same corrections; unlike
      # `publish --dry-run` it does not fail once the version is on npm.
      # Fail on any correction.
      - name: package.json survives an npm 11 publish
        run: |
          set -euo pipefail
          npx --yes npm@11.6.2 pkg fix
          if ! git diff --exit-code package.json; then
            echo "npm 11 would rewrite package.json on publish; apply the diff above" >&2
            exit 1
          fi
