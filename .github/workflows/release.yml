name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.npm.outputs.published }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # fail before any install or build when the tag and the version disagree
      - name: tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # a version already on npm (for example one published by hand) keeps its
      # tag and release: the publish job is skipped rather than failing on it.
      # A failed lookup counts as unpublished, so the publish runs and fails loudly.
      - name: version already on npm
        id: npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "${version}" ]; then
            echo "::notice::${name}@${version} is already on npm, skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-latest
    # least privilege: read the repo, and mint the OIDC token npm provenance needs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run check:pack
      # unit suite only: the browser e2e suite runs in CI on every push
      - run: npx vitest run --exclude '**/*.e2e.test.ts'
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
